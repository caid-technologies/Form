name: OpenCode session persistence
on:
  pull_request:
    paths:
      - 'forma_core/opencode/**'
      - 'apps/api/opencode_api.py'
      - 'supabase/migrations/*opencode*'
      - 'tests/opencode/**'
      - '.github/workflows/opencode-stale-sessions.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opencode_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify migration, timeout, reconnect, cancellation and grants
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d opencode_test -v ON_ERROR_STOP=1 -f tests/opencode/stale_sessions.sql
          psql -h localhost -U postgres -d opencode_test -v ON_ERROR_STOP=1 -f tests/opencode/lease_failures.sql
          psql -h localhost -U postgres -d opencode_test -v ON_ERROR_STOP=1 -f tests/opencode/serial_claims.sql
          psql -h localhost -U postgres -d opencode_test -v ON_ERROR_STOP=1 -f tests/opencode/stalled_commands.sql
      - name: Verify concurrent claims with independent Postgres connections
        env:
          OPENCODE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opencode_test
        run: |
          python -m pip install 'psycopg[binary]>=3.2,<4'
          python tests/opencode/postgres_claim_concurrency.py
