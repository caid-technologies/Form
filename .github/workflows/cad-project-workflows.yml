name: CAD project workflows
on:
  pull_request:
    paths:
      - 'forma_core/cad_export/**'
      - 'forma_core/cad_migrations/**'
      - 'forma_core/database.py'
      - 'forma_core/workspaces/projects/state.py'
      - 'apps/api/cad_workflows.py'
      - 'apps/api/cad_journey.py'
      - 'apps/web/app/forma-workspace/**'
      - 'apps/web/app/forma-workspace.tsx'
      - 'apps/web/lib/cad-model.ts'
      - 'apps/web/test/cad-model.test.ts'
      - 'apps/api/a2a.py'
      - 'tests/projects/test_cad_workflows.py'
      - '.github/workflows/cad-project-workflows.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -r apps/api/requirements.txt
      - run: python -m unittest tests.integrations.test_cad_export tests.integrations.test_cad_migrations tests.integrations.test_cad_native_evidence tests.integrations.test_cad_worker tests.projects.test_cad_workflows tests.projects.test_project_history -v

  frontend:
    runs-on: ubuntu-latest
    env:
      FORMA_AUTH_MODE: local
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint app/forma-workspace/cad-handoff-dialog.tsx app/forma-workspace/project-exports-panel.tsx app/forma-workspace/cad-model-panel.tsx lib/cad-model.ts
      - run: node --experimental-strip-types --test test/cad-model.test.ts
      - run: npm run build
