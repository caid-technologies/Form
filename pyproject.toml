[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caid-forma-core"
dynamic = ["version"]
description = "Reusable generation, validation, provider, and project-object core for Forma OSS."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "CAID TECHNOLOGIES, INC.", email = "team@caid-technologies.com" },
]
maintainers = [
    { name = "CAID TECHNOLOGIES, INC.", email = "team@caid-technologies.com" },
]
keywords = ["hardware", "eda", "llm", "agents", "pydantic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Typing :: Typed",
]
dependencies = [
    "google-auth>=2.29.0",
    "json-repair>=0.30.0",
    "keyring>=25.0.0",
    "pydantic>=2.12.0",
    "python-dotenv>=1.0.1",
    "pypdf>=5.0.0",
    "pypdfium2>=4.30.0",
    "sqlalchemy==2.0.31",
]

[project.urls]
Homepage = "https://github.com/caid-technologies/Forma-OSS"
Repository = "https://github.com/caid-technologies/Forma-OSS"
Documentation = "https://github.com/caid-technologies/Forma-OSS#readme"

[project.scripts]
forma-core = "forma_core.cli.main:main"
forma-oss = "forma_cli.app:app"
fabricator = "forma_core.fabricator.main:main"

[tool.vercel]
entrypoint = "apps.api.main:app"

[project.optional-dependencies]
gemini = ["google-genai>=1.0.0"]
vertex = ["google-auth>=2.29.0", "google-genai>=1.0.0"]
huggingface = ["huggingface-hub>=0.34.0"]
observability = ["langfuse>=4.0.0"]
supabase = ["supabase==2.31.0"]
tavily = ["tavily-python>=0.5.0"]
terminal = ["Pillow>=10.0.0"]
backend = [
    "fastapi>=0.124.1",
    "cryptography>=42.0.0",
    "Pillow>=10.0.0",
    "pypdf>=5.0.0",
    "redis>=5.0.0",
    "uvicorn",
    "websockets>=12.0",
    "supabase==2.31.0",
]
s3 = ["boto3==1.35.99"]
all = [
    "google-genai>=1.0.0",
    "boto3==1.35.99",
    "cryptography>=42.0.0",
    "fastapi>=0.124.1",
    "huggingface-hub>=0.34.0",
    "langfuse>=4.0.0",
    "Pillow>=10.0.0",
    "pypdf>=5.0.0",
    "redis>=5.0.0",
    "supabase==2.31.0",
    "tavily-python>=0.5.0",
    "uvicorn",
    "websockets>=12.0",
]
dev = [
    "build>=1.2.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "forma_core",
    "forma_core.*",
    "forma_cli",
    "forma_cli.*",
]

[tool.setuptools.package-data]
forma_core = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "forma_core._version.__version__" }
